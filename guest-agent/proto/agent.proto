syntax = "proto3";

package agent;

option go_package = "github.com/128f/fctl/agentpb";

message Request {
    oneof request_type {
        StatusRequest status = 1;
    }
}

message StatusRequest {
}

enum HealthStatus {
    HEALTHY = 0;
    DEGRADED = 1;
}

message StatusResponse {
    HealthStatus status = 1;
    uint32 cpu_pct = 2;
    uint64 mem_bytes = 3;
    uint64 last_beat = 4;
}
