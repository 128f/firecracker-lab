syntax = "proto3";

package agent;

option go_package = "github.com/128f/labctl/agentpb";

message Request {
    oneof request_type {
        StatusRequest status = 1;
        VmRestoreNotification vm_restore = 2;
        StartTcpVsockProxy start_tcp_vsock_proxy = 3;
        StopTcpVsockProxy stop_tcp_vsock_proxy = 4;
    }
}

message StatusRequest {
}

message StartTcpVsockProxy {
    uint32 tcp_port = 1;
    uint32 cid = 2;
    uint32 vsock_port = 3;
}

message StopTcpVsockProxy {
    uint32 tcp_port = 1;
}

message Response {
    oneof response_type {
        StatusResponse status = 1;
        Ack ack = 2;
        Error error = 3;
    }
}

message Ack {
}

message Error {
    string reason = 1;
}

enum HealthStatus {
    HEALTHY = 0;
    DEGRADED = 1;
}

message StatusResponse {
    HealthStatus status = 1;
    uint32 cpu_pct = 2;
    uint64 mem_available_bytes = 3;
    uint64 last_beat = 4;
}

message VmRestoreNotification {
    uint64 restored_at = 1;
}
