syntax = "proto3";

package agent;

option go_package = "github.com/128f/fctl/agentpb";

message Request {
    oneof request_type {
        StatusRequest status = 1;
    }
}

message StatusRequest {
}

enum HealthStatus {
    HEALTHY = 0;
    DEGRADED = 1;
}

message StatusResponse {
    HealthStatus status = 1;
}
